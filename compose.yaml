name: ai-challenge-day30

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  ollama:
    image: ollama/ollama:0.35.1@sha256:292ee7945dfc3d5840a181f3ab86fedb1e66703e02c8af98b50f4da56b7e278c
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "4"
      OLLAMA_KEEP_ALIVE: 30m
    volumes:
      - ollama:/root/.ollama
    mem_limit: 10g
    cpus: 6
    pids_limit: 256
    security_opt: [no-new-privileges:true]
    logging: *logging
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      retries: 30

  model-init:
    image: ollama/ollama:0.35.1@sha256:292ee7945dfc3d5840a181f3ab86fedb1e66703e02c8af98b50f4da56b7e278c
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: qwen3.5:9b-q4_K_M
      OLLAMA_NO_CLOUD: "1"
    entrypoint: [/bin/sh, -ec]
    command: ['ollama pull "$$OLLAMA_MODEL"']
    mem_limit: 256m
    logging: *logging

  app:
    image: ai-challenge-chat:day30
    build: .
    restart: unless-stopped
    init: true
    depends_on:
      model-init:
        condition: service_completed_successfully
    environment:
      PRIVATE_SERVICE: "1"
      PRIVATE_MAX_CONTEXT: "8192"
      PRIVATE_MAX_OUTPUT: "1000"
      PRIVATE_GENERATIONS_PER_MINUTE: "12"
      PRIVATE_WRITES_PER_MINUTE: "60"
      PRIVATE_MAX_QUEUE: "3"
      PRIVATE_QUEUE_WAIT_SECONDS: "180"
      PRIVATE_MAX_BODY_BYTES: "65536"
      LLM_DEFAULT_PROVIDER: ollama
      OLLAMA_MODEL: qwen3.5:9b-q4_K_M
      OLLAMA_NUM_CTX: "8192"
      OLLAMA_BASE_URL: http://ollama:11434
      RAG_LLM_PROFILE: optimized
      CHAT_DB_PATH: /app/data/chat.sqlite3
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HOME: /tmp/huggingface
      XDG_CACHE_HOME: /tmp/cache
    volumes:
      - chat:/app/data
      - ./data/models:/app/data/models:ro
      - ./data/document_index:/app/data/document_index:ro
      - ./data/documents:/app/data/documents:ro
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 3g
    cpus: 2
    pids_limit: 128
    logging: *logging

  gateway:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      SERVICE_HOST: ${SERVICE_HOST:?Set SERVICE_HOST in deployment environment}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?Set BASIC_AUTH_USER in deployment environment}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?Set BASIC_AUTH_HASH in deployment environment}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    logging: *logging

volumes:
  ollama:
  chat:
  caddy_data:
  caddy_config:
