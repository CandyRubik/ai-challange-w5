<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#10151c"/><g font-family="Arial, sans-serif"><text x="80" y="80" font-size="22" fill="#85c7a8">AI CHALLENGE  /  ДЕНЬ 29</text><text x="80" y="155" font-size="44" fill="#eaf0f7">Сначала проверяем параметры</text><text x="80" y="220" font-size="23" fill="#aab6c7">Temperature, лимит ответа и окно контекста</text><text x="80" y="330" font-size="30" fill="#eaf0f7">До: temperature 0 · ответ до 3000 · контекст 32768.</text><text x="80" y="378" font-size="30" fill="#eaf0f7">После: temperature 0 · ответ до 1000 · контекст 8192.</text><text x="80" y="426" font-size="30" fill="#eaf0f7"></text><text x="80" y="474" font-size="30" fill="#eaf0f7">Проверены temperature 0.1/0.2, контекст 16384 и лимит 1500.</text><text x="80" y="522" font-size="30" fill="#eaf0f7">Для длинной памяти контекст может вырасти до 32768.</text><text x="80" y="570" font-size="30" fill="#eaf0f7">Thinking отключён в обоих вариантах.</text><text x="80" y="858" font-size="20" fill="#8796aa">02  ·  Локальная Qwen 3.5 9B  ·  Измеренные результаты</text></g></svg>