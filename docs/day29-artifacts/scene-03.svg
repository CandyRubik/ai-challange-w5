<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#10151c"/><g font-family="Arial, sans-serif"><text x="80" y="80" font-size="22" fill="#85c7a8">AI CHALLENGE  /  ДЕНЬ 29</text><text x="80" y="155" font-size="44" fill="#eaf0f7">Сравним один и тот же вопрос</text><text x="80" y="220" font-size="23" fill="#aab6c7">Что FutureRenderer делает, пока загружаются изображения?</text><rect x="70" y="285" width="710" height="495" rx="16" fill="#19222d"/><rect x="810" y="285" width="720" height="495" rx="16" fill="#19222d"/><text x="95" y="330" font-size="27" fill="#aab6c7">ДО · исходный prompt</text><text x="95" y="390" font-size="24" fill="#eaf0f7">FutureRenderer отрисовывает текст страницы, пока</text><text x="95" y="426" font-size="24" fill="#eaf0f7">загружаются все изображения.</text><text x="95" y="462" font-size="24" fill="#eaf0f7">Класс FutureRenderer использует ExecutorService</text><text x="95" y="498" font-size="24" fill="#eaf0f7">для асинхронной загрузки изображений и</text><text x="95" y="534" font-size="24" fill="#eaf0f7">последующей их отрисовки.</text><text x="835" y="330" font-size="27" fill="#85c7a8">ПОСЛЕ · новый prompt</text><text x="835" y="390" font-size="24" fill="#eaf0f7">FutureRenderer отрисовывает текст страницы, пока</text><text x="835" y="426" font-size="24" fill="#eaf0f7">загружаются все изображения.</text><text x="835" y="462" font-size="24" fill="#eaf0f7">Метод renderPage сначала создает задачу для</text><text x="835" y="498" font-size="24" fill="#eaf0f7">загрузки изображений, а затем сразу же</text><text x="835" y="534" font-size="24" fill="#eaf0f7">отрисовывает текст.</text><text x="835" y="570" font-size="24" fill="#eaf0f7">После отрисовки текста программа ожидает</text><text x="835" y="606" font-size="24" fill="#eaf0f7">завершения загрузки изображений, вызывая</text><text x="835" y="642" font-size="24" fill="#eaf0f7">future.get(), чтобы получить результат.</text><text x="80" y="858" font-size="20" fill="#8796aa">03  ·  Локальная Qwen 3.5 9B  ·  Измеренные результаты</text></g></svg>