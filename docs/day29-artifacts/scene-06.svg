<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#10151c"/><g font-family="Arial, sans-serif"><text x="80" y="80" font-size="22" fill="#85c7a8">AI CHALLENGE  /  ДЕНЬ 29</text><text x="80" y="155" font-size="44" fill="#eaf0f7">Проверяем качество отдельно от формата</text><text x="80" y="220" font-size="23" fill="#aab6c7">Ожидаемые факты записаны до контрольного прогона</text><text x="80" y="330" font-size="30" fill="#eaf0f7">Полнота: до 33/42, после 33/42.</text><text x="80" y="378" font-size="30" fill="#eaf0f7">Верные отказы после: 12/12.</text><text x="80" y="426" font-size="30" fill="#eaf0f7"></text><text x="80" y="474" font-size="30" fill="#eaf0f7">Цитаты проверяются дословно; смысл оценён отдельно.</text><text x="80" y="522" font-size="30" fill="#eaf0f7">Отрицательные вопросы тоже передаются модели с контекстом.</text><text x="80" y="570" font-size="30" fill="#eaf0f7">Оценка Codex на небольшой выборке требует проверки человеком.</text><text x="80" y="858" font-size="20" fill="#8796aa">06  ·  Локальная Qwen 3.5 9B  ·  Измеренные результаты</text></g></svg>